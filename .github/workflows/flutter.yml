name: Flutter CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verifier:
    name: Analyse, tests et builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Générer les dossiers de plateforme manquants
        run: flutter create . --org cm.marche --project-name marche_cm --platforms=android,web

      - name: Dépendances
        run: flutter pub get

      - name: Versions utilisées
        run: |
          flutter --version
          grep -A9 -E "^  (material_ui|cupertino_ui):" pubspec.lock | grep -E "_ui:|version"

      - name: Analyse statique
        run: flutter analyze --no-fatal-infos

      - name: Tests
        run: flutter test

      - name: Build web
        run: flutter build web --release --no-web-resources-cdn

      - name: Build APK Android
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: marche-cm-web
          path: build/web

      - uses: actions/upload-artifact@v4
        with:
          name: marche-cm-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publier la démo web sur la branche demo-web
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feature/')
        run: |
          cd build/web
          touch .nojekyll
          git init -q -b demo-web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Démo web — ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" demo-web
